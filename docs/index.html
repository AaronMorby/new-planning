<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>National Planning Applications</title><style>body{font:16px Arial,sans-serif;margin:2rem}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:.6rem;text-align:left;vertical-align:top}th{background:#eee}input{padding:.5rem;font:inherit}label{display:block;margin-bottom:.5rem}button{padding:.6rem 1rem;font:inherit;cursor:pointer}</style></head><body><h1>National Planning Applications</h1><p id="count">Showing 0 records.</p><form id="filters"><label>Area: <input id="area" value=""></label><label>Application search: <input id="application" placeholder="Reference or description"></label><label>Min size (m²): <input id="min" type="number" step="any" value=""></label><label>Max size (m²): <input id="max" type="number" step="any" value=""></label><label>Application date, last N days (0 = all): <input id="days" type="number" min="0" value="0"></label><label><input id="approved" type="checkbox"> Approved only</label><button type="submit">Update search terms</button></form><table><thead><tr><th>Reference</th><th>Address</th><th>Description</th><th>Application date</th><th>Decision</th><th>Size (m²)</th></tr></thead><tbody id="results"><tr><td colspan="6">No matching applications found.</td></tr></tbody></table><script>const rows=[...document.querySelectorAll('#results tr')],form=document.querySelector('#filters'),area=document.querySelector('#area'),application=document.querySelector('#application'),min=document.querySelector('#min'),max=document.querySelector('#max'),days=document.querySelector('#days'),approved=document.querySelector('#approved'),count=document.querySelector('#count');function apply(){const a=area.value.toLowerCase().trim(),q=application.value.toLowerCase().trim(),lo=min.value===''?-Infinity:Number(min.value),hi=max.value===''?Infinity:Number(max.value),n=Number(days.value||0),cut=n>0?Date.now()-n*86400000:null;let shown=0;rows.forEach(r=>{const text=((r.dataset.address||'')+' '+(r.dataset.description||'')+' '+(r.textContent||'')).toLowerCase(),s=r.dataset.size===''?null:Number(r.dataset.size),d=r.dataset.date||'',status=(r.dataset.decision||'').toLowerCase(),ok=(!a||text.includes(a))&&(!q||text.includes(q))&&(s===null||(s>=lo&&s<=hi))&&(!cut||(d&&Date.parse(d)>=cut))&&(!approved.checked||['approved','granted','grant','permission','permit'].some(x=>status.includes(x)));r.style.display=ok?'':'none';if(ok)shown++});count.textContent='Showing '+shown+' records.'}form.addEventListener('submit',e=>{e.preventDefault();apply()});[area,application,min,max,days,approved].forEach(e=>{e.addEventListener('input',apply);e.addEventListener('change',apply)});apply();</script></body></html>
