name: Update planning applications dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build dashboard
        id: collect
        continue-on-error: true
        run: python3 planit_scraper.py

      - name: Record failure without erasing previous results
        if: steps.collect.outcome == 'failure'
        run: |
          mkdir -p docs
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          Path("docs/coverage.json").write_text(json.dumps({
              "run_utc": datetime.now(timezone.utc).isoformat(),
              "national_planit": "NOT COMPLETED",
              "warning": "PLANNING SEARCH WARNING: collection failed; existing dashboard may be stale. Check Actions logs. No zero-result claim.",
              "councils": {"status": "NOT VERIFIED"}
          }, indent=2), encoding="utf-8")
          PY

      - name: Publish dashboard and coverage
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Update planning applications dashboard"
          git push

      - name: Mark failed collector run
        if: steps.collect.outcome == 'failure'
        run: exit 1
