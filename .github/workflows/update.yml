name: Verify published planning snapshot (Render is live collector)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate dated dashboard snapshot
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/index.html')
          c = json.loads(Path('docs/coverage.json').read_text())
          assert p.exists() and p.stat().st_size > 500, 'Snapshot page missing'
          assert 'not a live feed' in p.read_text().lower(), 'Snapshot missing stale-data warning'
          assert c.get('live_collector') == 'Render planit-national-collector', 'Incorrect source'
          assert c.get('auto_sync') is False, 'Never mislabel static snapshot as live'
          print('GitHub snapshot validated; the real national planning collector is on Render.')
          print('Latest verified run:', c['last_verified_run_utc'])
          print('Render dashboard:', c['render_dashboard_url'])
          PY
